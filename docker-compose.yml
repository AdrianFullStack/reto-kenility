version: '3.8'
services:
  db:
    image: mongo:latest
    ports:
      - "${MONGO_PORT}:${MONGO_PORT}"
    volumes:
      - mongo_data:/data/db
  api:
    build: .
    ports:
      - "${APP_PORT}:${APP_PORT}"
    environment:
      - APP_PORT=${APP_PORT}
      - MONGO_PORT=${MONGO_PORT}
      - MONGO_URI=mongodb://db:${MONGO_PORT}/challenge_db
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - db

volumes:
  mongo_data: